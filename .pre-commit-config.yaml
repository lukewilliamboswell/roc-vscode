repos:
  - repo: local
    hooks:
      # General checks
      - name: Prevent committing to main
        id: no-commit-to-branch
        language: system
        entry: no-commit-to-branch
        args: [--branch, main]
        pass_filenames: false
      - name: Make sure files end with a newline character
        id: end-of-file-fixer
        language: system
        entry: end-of-file-fixer
        types: [text]
        # Vendored files are pinned by hash in syntaxes/oracle/vendor/manifest.json
        exclude: ^syntaxes/oracle/vendor/
      - name: Remove trailing whitespace
        id: trailing-whitespace-fixer
        language: system
        entry: trailing-whitespace-fixer
        types: [text]
      - name: Check for files that would conflict on case-insensitive filesystem
        id: check-case-conflict
        language: system
        entry: check-case-conflict
      - name: Check for merge conflicts
        id: check-merge-conflict
        language: system
        entry: check-merge-conflict
      - name: Check executable files have a shebang
        id: check-executables-have-shebangs
        language: system
        entry: check-executables-have-shebangs
        types: [executable]
      - name: Check scripts with a shebang are executable
        id: check-shebang-scripts-are-executable
        language: system
        entry: check-shebang-scripts-are-executable
      - name: Don't allow adding large files
        id: check-added-large-files
        language: system
        entry: check-added-large-files

      # Typescript
      - name: Check Typescript files
        id: biome-check
        language: system
        entry: biome check
        types: [ts]
      - name: Typecheck Typescript files
        id: tsc
        language: system
        entry: tsc --noEmit
        types: [ts]
        pass_filenames: false

      # Roc
      - name: Format Roc files
        id: roc-format
        language: system
        entry: scripts/roc-format-spaces.sh
        files: \.roc$
        # Grammar fixtures carry column-exact assertion comments, which the
        # formatter re-indents and so silently breaks; some are deliberately
        # unformatted or partial code. The VSIX test workspace includes a file
        # that must stay unformatted.
        exclude: ^(syntaxes/tests/|test/fixtures/)

      # Textmate Grammar
      - name: Update Textmate Grammar snapshots
        id: update-snapshots
        language: system
        entry: just update-snapshots
        files: ^syntaxes/
        pass_filenames: false

      # JSON
      - name: Format JSON files
        id: biome-format
        language: system
        entry: biome format --write
        types: [json]

      # YAML
      - name: Format YAML files
        id: yamlfix
        language: system
        entry: yamlfix
        types: [yaml]

      # GitHub Actions
      - name: Lint GitHub workflows
        id: actionlint
        language: system
        entry: actionlint
        types: [yaml]
        files: ^\.github/workflows/
      - name: Pin GitHub action versions
        id: ratchet
        language: system
        entry: ratchet lint
        types: [yaml]
        files: ^\.github/workflows/
      - name: Check security of Github workflows
        id: zizmor
        language: system
        entry: zizmor
        types: [yaml]
        files: ^\.github/workflows/

      # Just
      - name: Format Justfile
        id: just-format
        language: system
        entry: just --unstable --fmt
        files: ^Justfile$
        pass_filenames: false

      # Shell
      - name: Lint shell scripts
        id: shellcheck
        language: system
        entry: shellcheck
        types: [shell]

      # Nix
      - name: Format Nix files
        id: nixfmt
        language: system
        entry: nixfmt
        types: [nix]
      - name: Lint Nix files
        id: deadnix
        language: system
        entry: deadnix
        types: [nix]

      # Markdown
      - name: Format markdown files
        id: rumdl
        language: system
        entry: rumdl fmt
        types: [markdown]

      # Keep sorted
      - name: Keep sorted
        id: keep-sorted
        language: system
        entry: keep-sorted
        types: [text]

      # Check versions match
      - name: Check versions match
        id: check-versions-match
        language: system
        entry: scripts/check-versions-match.py
        always_run: true
        pass_filenames: false
