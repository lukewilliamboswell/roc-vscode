name: Build, test and release

permissions: {}

on:
  # Run on all PRs
  pull_request:
  # Run on merge to main
  push:
    branches: [main]
  # Run when a release is published
  release:
    types: [published]

jobs:
  build:
    name: Build and test the VSIX
    permissions:
      contents: write  # for `gh release upload`
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1  # Fetch only the latest commit

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # ratchet:nixbuild/nix-quick-install-action@v35

      - name: Cache Nix environment
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # ratchet:nix-community/cache-nix-action@v7  # zizmor: ignore[cache-poisoning]
        # Don't enable the cache when releasing to avoid cache-poisoning
        if: ${{ github.event_name != 'release' }}
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}

      - name: Check tag matches package version
        if: github.event_name == 'release' # Only check when a release is published
        run: scripts/check-versions-match.py "$VERSION"
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Build Nix package
        run: nix build --no-link .#roc-vscode

      # Build the VSIX exactly once. Every later step, including the release
      # upload, uses this file: what is tested is what ships.
      - name: Build VSIX
        id: vsix
        run: |
          mkdir -p build/
          version="$(jq --raw-output .version package.json)"
          cat "$(nix build --no-link --print-out-paths .#roc-vscode-vsix)" > "build/roc-vscode-$version.vsix"
          echo "path=build/roc-vscode-$version.vsix" >> "$GITHUB_OUTPUT"
          sha256sum "build/roc-vscode-$version.vsix" | tee build/SHA256SUMS

      - name: Use Nix dev shell for subsequent steps
        uses: rrbutani/use-nix-shell-action@59a52b2b9bbfe3cc0e7deb8f9059abe37a439edf  # ratchet:rrbutani/use-nix-shell-action@v1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Inspect the VSIX
        run: just check-vsix "$VSIX"
        env:
          VSIX: ${{ steps.vsix.outputs.path }}

      # Install the VSIX into an isolated VS Code, on both the oldest version it
      # claims to support and the current stable, and drive it against the
      # pinned Roc nightly.
      - name: Test the VSIX end to end
        run: just test-vsix-matrix "$VSIX" --roc pinned
        env:
          VSIX: ${{ steps.vsix.outputs.path }}

      - name: Check the VSIX is unchanged since it was built
        run: sha256sum --check build/SHA256SUMS

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7
        with:
          name: roc-vscode-vsix
          path: build/

      - name: Upload artifact to release
        if: github.event_name == 'release' # Only upload when a release is published
        run: gh release upload "$VERSION" "$VSIX" build/SHA256SUMS
        env:
          VERSION: ${{ github.ref_name }}
          VSIX: ${{ steps.vsix.outputs.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Don't upload anything to VSCode Marketplace or Open VSX yet

      # - name: Publish to VSCode Marketplace
      #   if: github.event_name == 'release' # Only publish when a release is published
      #   run: npx --no-install --call "vsce publish --packagePath $VSIX"
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # - name: Publish to Open VSX
      #   if: github.event_name == 'release' # Only publish when a release is published
      #   run: npx --no-install --call "ovsx publish $VSIX"
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
